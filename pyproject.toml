[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoluozi"
version = "0.1.0"
description = "小落子：一个 Python 进程上的个人助手工作台。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "openai>=1.40",
  "hindsight-litellm>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xiaoluozi = "xiaoluozi.__main__:main"

[tool.setuptools.packages.find]
include = ["xiaoluozi*"]

[tool.setuptools.package-data]
xiaoluozi = ["page.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
