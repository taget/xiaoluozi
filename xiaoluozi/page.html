<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小落子</title>
  <style>
    :root {
      --paper: #f6f1e8;
      --sheet: #fffdf8;
      --ink: #241c16;
      --muted: #6f655b;
      --line: #e3d9cc;
      --seal: #8f3228;
      --seal-ink: #fff8f2;
      --warn-bg: #f4ead0;
      --warn-ink: #6a4b16;
      --fail-bg: #f8e6e1;
      --fail-ink: #6e2e26;
      --shadow: 0 18px 50px rgba(60, 40, 20, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top, #fbf7f0 0%, var(--paper) 55%, #ebe3d6 100%);
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    .desk {
      width: min(40rem, calc(100% - 1.5rem));
      margin: 0 auto;
      padding: 1.25rem 0 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr;
      column-gap: 0.9rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .seal {
      width: 3.1rem;
      height: 3.1rem;
      display: grid;
      place-items: center;
      border-radius: 0.35rem;
      background: var(--seal);
      color: var(--seal-ink);
      font-family: "Songti SC", "Noto Serif SC", "PMingLiU", serif;
      font-size: 1.7rem;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 2px rgba(255, 248, 242, 0.35);
    }

    h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif SC", "PMingLiU", serif;
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .lede {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .banner {
      margin: 0 0 0.9rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0.7rem;
      background: var(--warn-bg);
      color: var(--warn-ink);
      font-size: 0.92rem;
    }

    .sheet {
      flex: 1;
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      padding: 1.1rem 1rem 0.9rem;
      display: flex;
      flex-direction: column;
      min-height: 24rem;
    }

    #thread {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .empty {
      margin: auto;
      max-width: 16rem;
      text-align: center;
      color: var(--muted);
    }

    .turn { display: flex; flex-direction: column; gap: 0.35rem; }

    .who {
      margin: 0;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .said, .pending, .fail {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .said {
      padding-bottom: 0.65rem;
      border-bottom: 1px dashed var(--line);
    }

    .reply {
      margin: 0;
      font-size: 1.05rem;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .reply > :first-child { margin-top: 0; }
    .reply > :last-child { margin-bottom: 0; }

    .reply p,
    .reply ul,
    .reply ol,
    .reply pre,
    .reply blockquote,
    .reply h2,
    .reply h3,
    .reply h4,
    .reply .table-wrap {
      margin: 0.55rem 0;
    }

    .reply h2,
    .reply h3,
    .reply h4 {
      font-family: "Songti SC", "Noto Serif SC", "PMingLiU", serif;
      font-weight: 600;
      line-height: 1.35;
    }

    .reply h2 { font-size: 1.22rem; }
    .reply h3 { font-size: 1.08rem; }
    .reply h4 { font-size: 1rem; }

    .reply ul,
    .reply ol { padding-left: 1.25rem; }

    .reply li { margin: 0.18rem 0; }
    .reply li > ul,
    .reply li > ol { margin: 0.15rem 0; }

    .reply a { color: var(--seal); }

    .reply code {
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
      font-size: 0.88em;
      background: #f3eee6;
      padding: 0.05em 0.35em;
      border-radius: 0.3rem;
    }

    .reply pre {
      overflow-x: auto;
      background: #f3eee6;
      border-radius: 0.65rem;
      padding: 0.75rem 0.85rem;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
    }

    .reply pre code {
      background: none;
      padding: 0;
      font-size: 0.86rem;
      white-space: pre;
      word-break: normal;
      overflow-wrap: normal;
    }

    .reply pre[data-lang]::before {
      content: attr(data-lang);
      display: block;
      margin-bottom: 0.35rem;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .reply blockquote {
      margin-left: 0;
      padding-left: 0.8rem;
      border-left: 3px solid var(--line);
      color: var(--muted);
    }

    .reply blockquote a { color: var(--seal); }

    .reply hr {
      border: 0;
      border-top: 1px solid var(--line);
    }

    .reply img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
    }

    .reply .table-wrap { overflow-x: auto; }

    .reply table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .reply th,
    .reply td {
      border-bottom: 1px solid var(--line);
      padding: 0.35rem 0.45rem;
      vertical-align: top;
    }

    .reply input[type="checkbox"] {
      accent-color: var(--seal);
      margin-right: 0.35rem;
    }

    .decision {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .pending { color: var(--muted); }

    .fail {
      padding: 0.65rem 0.75rem;
      border-radius: 0.65rem;
      background: var(--fail-bg);
      color: var(--fail-ink);
    }

    .note {
      margin: 0.2rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    form {
      display: flex;
      gap: 0.55rem;
      margin-top: 1rem;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.75rem 1rem;
      font: inherit;
      font-size: 1rem;
    }

    input:focus {
      outline: 2px solid rgba(143, 50, 40, 0.35);
      border-color: var(--seal);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1.1rem;
      background: var(--seal);
      color: var(--seal-ink);
      font: inherit;
      font-size: 1rem;
      cursor: pointer;
    }

    button:disabled {
      cursor: progress;
      opacity: 0.65;
    }

    @media (max-width: 640px) {
      .desk { width: min(100% - 1rem, 40rem); padding-top: 0.8rem; }
      .sheet { min-height: 70vh; border-radius: 0.8rem; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="desk">
    <header>
      <div class="seal" aria-hidden="true">落</div>
      <div>
        <h1>小落子</h1>
        <p class="lede">一句话进来，我回你一句。</p>
        <p id="channel-note" class="lede" hidden></p>
      </div>
    </header>
    <p id="banner" class="banner" hidden></p>
    <section class="sheet">
      <div id="thread" aria-live="polite">
        <p id="empty" class="empty">还没有对话。写下一句想说的话。</p>
      </div>
      <form id="composer">
        <label for="message">想说的话</label>
        <input id="message" name="message" autocomplete="off" placeholder="写一句你想说的话" enterkeyhint="send">
        <button id="send" type="submit">发送</button>
      </form>
      <p id="form-error" class="note" hidden></p>
    </section>
  </div>
  <script>
    const banner = document.getElementById("banner");
    const channelNote = document.getElementById("channel-note");
    const thread = document.getElementById("thread");
    const form = document.getElementById("composer");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    const formError = document.getElementById("form-error");
    let sending = false;
    let holdError = false;
    let historyKey = "";
    let weixinOn = false;
    let historyWatch = false;

    function showBanner(text) {
      banner.hidden = false;
      banner.textContent = text;
    }

    async function loadStatus() {
      send.disabled = true;
      try {
        const response = await fetch("/api/status");
        if (!response.ok) throw new Error("status");
        const data = await response.json();
        if (data.model_configured) {
          banner.hidden = true;
          banner.textContent = "";
        } else {
          showBanner("模型还没配好。在 .env 里设置 TYPESAFE_API_KEY 之后，这句话才能得到回复。");
        }
        if (data.weixin_configured) {
          weixinOn = true;
          channelNote.hidden = false;
          channelNote.textContent = "微信和这个页面是同一段对话。";
          if (!historyWatch) {
            historyWatch = true;
            setInterval(() => {
              if (document.visibilityState === "visible") loadHistory();
            }, 15000);
          }
        }
      } catch (err) {
        showBanner("暂时没能确认模型是否配好。");
      } finally {
        send.disabled = false;
      }
    }

    /* md-start */
    function splitShown(text) {
      const source = String(text || "");
      const match = source.match(/^(.*)\n\n(选用 \S+。依据：.*)$/s);
      if (!match) return { body: source, decision: "" };
      return { body: match[1], decision: match[2] };
    }

    function safeHttpUrl(raw) {
      const url = String(raw || "").trim();
      if (/^https?:\/\//i.test(url) || /^mailto:/i.test(url)) return url;
      return "";
    }

    function readWrapped(rest) {
      const image = rest.startsWith("![");
      const open = image ? 1 : 0;
      if (rest[open] !== "[") return null;
      const labelEnd = rest.indexOf("](", open + 1);
      if (labelEnd === -1) return null;
      const label = rest.slice(open + 1, labelEnd);
      if (label.includes("[")) return null;
      let cursor = labelEnd + 2;
      let url = "";
      if (rest[cursor] === "<") {
        const close = rest.indexOf(">", cursor + 1);
        if (close === -1) return null;
        url = rest.slice(cursor + 1, close);
        cursor = close + 1;
      } else {
        const start = cursor;
        let depth = 0;
        for (; cursor < rest.length; cursor += 1) {
          const ch = rest[cursor];
          if (ch === "\\") {
            cursor += 1;
            continue;
          }
          if (/\s/.test(ch)) break;
          if (ch === "(") depth += 1;
          else if (ch === ")") {
            if (depth === 0) break;
            depth -= 1;
          }
        }
        url = rest.slice(start, cursor);
      }
      while (cursor < rest.length && /\s/.test(rest[cursor])) cursor += 1;
      if (rest[cursor] === '"' || rest[cursor] === "'") {
        const quote = rest[cursor];
        cursor += 1;
        while (cursor < rest.length && rest[cursor] !== quote) cursor += 1;
        if (rest[cursor] !== quote) return null;
        cursor += 1;
        while (cursor < rest.length && /\s/.test(rest[cursor])) cursor += 1;
      }
      if (rest[cursor] !== ")") return null;
      return { image, label, url, length: cursor + 1 };
    }

    function appendPlain(parent, chunk) {
      const pattern = /https?:\/\/[^\s<]+/g;
      let last = 0;
      let found;
      while ((found = pattern.exec(chunk))) {
        parent.append(document.createTextNode(chunk.slice(last, found.index)));
        let href = found[0];
        let extra = "";
        const trimmed = href.match(/^(.*?)[),.;:!?，。；：！？]+$/);
        if (trimmed) {
          extra = href.slice(trimmed[1].length);
          href = trimmed[1];
        }
        const link = document.createElement("a");
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = href;
        parent.append(link);
        if (extra) parent.append(document.createTextNode(extra));
        last = found.index + found[0].length;
      }
      parent.append(document.createTextNode(chunk.slice(last)));
    }

    function appendInline(parent, text) {
      const source = String(text || "");
      let i = 0;
      while (i < source.length) {
        const rest = source.slice(i);
        if (rest[0] === "\\" && rest.length > 1) {
          parent.append(document.createTextNode(rest[1]));
          i += 2;
          continue;
        }
        if (rest[0] === "`") {
          let size = 0;
          while (rest[size] === "`") size += 1;
          const close = rest.indexOf("`".repeat(size), size);
          if (close !== -1) {
            const code = document.createElement("code");
            code.textContent = rest.slice(size, close);
            parent.append(code);
            i += close + size;
            continue;
          }
        }
        const auto = rest.match(/^<(https?:\/\/[^>\s]+)>/i);
        if (auto) {
          const link = document.createElement("a");
          link.href = auto[1];
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = auto[1];
          parent.append(link);
          i += auto[0].length;
          continue;
        }
        const wrapped = readWrapped(rest);
        if (wrapped) {
          const url = safeHttpUrl(wrapped.url);
          if (wrapped.image) {
            if (/^https?:\/\//i.test(url)) {
              const img = document.createElement("img");
              img.src = url;
              img.alt = wrapped.label;
              img.loading = "lazy";
              parent.append(img);
            } else if (wrapped.label) {
              parent.append(document.createTextNode(wrapped.label));
            }
          } else if (url) {
            const link = document.createElement("a");
            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            appendInline(link, wrapped.label);
            parent.append(link);
          } else {
            appendInline(parent, wrapped.label);
          }
          i += wrapped.length;
          continue;
        }
        const bold = rest.match(/^(?:\*\*([^*]+)\*\*|__([^_]+)__)/);
        if (bold) {
          const strong = document.createElement("strong");
          appendInline(strong, bold[1] || bold[2]);
          parent.append(strong);
          i += bold[0].length;
          continue;
        }
        const strike = rest.match(/^~~([^~]+)~~/);
        if (strike) {
          const del = document.createElement("del");
          appendInline(del, strike[1]);
          parent.append(del);
          i += strike[0].length;
          continue;
        }
        const italic = rest.match(/^\*([^*\n]+)\*|^_([^_\s]+)_(?!\w)/);
        if (italic) {
          const em = document.createElement("em");
          appendInline(em, italic[1] || italic[2]);
          parent.append(em);
          i += italic[0].length;
          continue;
        }
        const special = rest.search(/[\\`!*_~\[]/);
        const take = special === -1 ? rest.length : Math.max(special, 1);
        appendPlain(parent, rest.slice(0, take));
        i += take;
      }
    }

    function isRule(line) {
      return /^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line);
    }

    function isSeparator(line) {
      const cells = splitRow(line);
      return cells.length > 0 && cells.every((cell) => /^:?-+:?$/.test(cell));
    }

    function splitRow(line) {
      let row = line.trim();
      if (row.startsWith("|")) row = row.slice(1);
      if (row.endsWith("|")) row = row.slice(0, -1);
      return row.split("|").map((cell) => cell.trim());
    }

    function readFence(lines, i) {
      const open = lines[i].match(/^(`{3,}|~{3,})([^\s`]*)\s*$/);
      if (!open) return null;
      const mark = open[1][0];
      const size = open[1].length;
      const lang = open[2];
      const body = [];
      let j = i + 1;
      while (j < lines.length) {
        const close = lines[j].match(/^(`{3,}|~{3,})\s*$/);
        if (close && close[1][0] === mark && close[1].length >= size) break;
        body.push(lines[j]);
        j += 1;
      }
      const pre = document.createElement("pre");
      if (lang) pre.dataset.lang = lang;
      const code = document.createElement("code");
      code.textContent = body.join("\n");
      pre.append(code);
      return { node: pre, next: j < lines.length ? j + 1 : j };
    }

    function readQuote(lines, i) {
      const gathered = [];
      let j = i;
      while (j < lines.length && /^>\s?/.test(lines[j])) {
        gathered.push(lines[j].replace(/^>\s?/, ""));
        j += 1;
      }
      const quote = document.createElement("blockquote");
      fillMarkdown(quote, gathered.join("\n"));
      return { node: quote, next: j };
    }

    function listMatch(line) {
      const matched = line.match(/^(\s*)(?:([-*+])|(\d+[.)]))\s+(.*)$/);
      if (!matched) return null;
      return {
        indent: matched[1].length,
        bullet: matched[2] || "",
        number: matched[3] || "",
        text: matched[4]
      };
    }

    function readList(lines, i) {
      const first = listMatch(lines[i]);
      const ordered = Boolean(first && first.number);
      const startIndent = first ? first.indent : 0;
      const list = document.createElement(ordered ? "ol" : "ul");
      if (ordered && first.number) {
        const start = parseInt(first.number, 10);
        if (start > 1) list.start = start;
      }
      while (i < lines.length) {
        if (/^\s*$/.test(lines[i])) {
          let j = i + 1;
          while (j < lines.length && /^\s*$/.test(lines[j])) j += 1;
          const upcoming = j < lines.length ? listMatch(lines[j]) : null;
          if (upcoming && upcoming.indent === startIndent && Boolean(upcoming.number) === ordered) {
            i = j;
            continue;
          }
          break;
        }
        const item = listMatch(lines[i]);
        if (!item || item.indent < startIndent || Boolean(item.number) !== ordered) break;
        if (item.indent > startIndent) {
          const nested = readList(lines, i);
          const last = list.lastElementChild;
          if (last) last.append(nested.node);
          else list.append(nested.node);
          i = nested.next;
          continue;
        }
        const li = document.createElement("li");
        let content = item.text;
        const task = content.match(/^\[([ xX])\]\s+(.*)$/);
        if (task) {
          const box = document.createElement("input");
          box.type = "checkbox";
          box.disabled = true;
          box.checked = task[1].toLowerCase() === "x";
          li.append(box);
          content = task[2];
        }
        appendInline(li, content);
        list.append(li);
        i += 1;
        while (
          i < lines.length &&
          /^\s+\S/.test(lines[i]) &&
          !listMatch(lines[i]) &&
          !startsBlock(lines, i)
        ) {
          li.append(document.createElement("br"));
          appendInline(li, lines[i].trim());
          i += 1;
        }
      }
      return { node: list, next: i };
    }

    function readTable(lines, i) {
      if (i + 1 >= lines.length || !lines[i].includes("|") || !isSeparator(lines[i + 1])) return null;
      const align = splitRow(lines[i + 1]).map((cell) => {
        const left = cell.startsWith(":");
        const right = cell.endsWith(":");
        if (left && right) return "center";
        if (right) return "right";
        return "left";
      });
      const table = document.createElement("table");
      const head = document.createElement("tr");
      splitRow(lines[i]).forEach((cell, index) => {
        const th = document.createElement("th");
        th.style.textAlign = align[index] || "left";
        appendInline(th, cell);
        head.append(th);
      });
      const thead = document.createElement("thead");
      thead.append(head);
      table.append(thead);
      const body = document.createElement("tbody");
      let j = i + 2;
      while (j < lines.length && lines[j].includes("|") && !/^\s*$/.test(lines[j])) {
        const row = document.createElement("tr");
        splitRow(lines[j]).forEach((cell, index) => {
          const td = document.createElement("td");
          td.style.textAlign = align[index] || "left";
          appendInline(td, cell);
          row.append(td);
        });
        body.append(row);
        j += 1;
      }
      table.append(body);
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      wrap.append(table);
      return { node: wrap, next: j };
    }

    function startsBlock(lines, i) {
      const line = lines[i];
      if (/^(`{3,}|~{3,})/.test(line)) return true;
      if (/^(#{1,6})\s+/.test(line)) return true;
      if (isRule(line)) return true;
      if (/^>\s?/.test(line)) return true;
      if (listMatch(line)) return true;
      if (i + 1 < lines.length && line.includes("|") && isSeparator(lines[i + 1])) return true;
      return false;
    }

    function addParagraph(parent, textLines) {
      const paragraph = document.createElement("p");
      textLines.forEach((line, index) => {
        if (index) paragraph.append(document.createElement("br"));
        appendInline(paragraph, line);
      });
      parent.append(paragraph);
    }

    function fillMarkdown(parent, source) {
      const lines = String(source || "").replace(/\r\n?/g, "\n").split("\n");
      let i = 0;
      while (i < lines.length) {
        if (/^\s*$/.test(lines[i])) {
          i += 1;
          continue;
        }
        const fence = readFence(lines, i);
        if (fence) {
          parent.append(fence.node);
          i = fence.next;
          continue;
        }
        const heading = lines[i].match(/^(#{1,6})\s+(.*?)\s*$/);
        if (heading) {
          const title = document.createElement("h" + Math.min(heading[1].length + 1, 4));
          appendInline(title, heading[2].replace(/\s+#+\s*$/, ""));
          parent.append(title);
          i += 1;
          continue;
        }
        if (isRule(lines[i])) {
          parent.append(document.createElement("hr"));
          i += 1;
          continue;
        }
        if (/^>\s?/.test(lines[i])) {
          const quote = readQuote(lines, i);
          parent.append(quote.node);
          i = quote.next;
          continue;
        }
        if (listMatch(lines[i])) {
          const list = readList(lines, i);
          parent.append(list.node);
          i = list.next;
          continue;
        }
        const table = readTable(lines, i);
        if (table) {
          parent.append(table.node);
          i = table.next;
          continue;
        }
        const paragraph = [];
        while (i < lines.length && !/^\s*$/.test(lines[i]) && !startsBlock(lines, i)) {
          paragraph.push(lines[i]);
          i += 1;
        }
        if (paragraph.length) addParagraph(parent, paragraph);
        else {
          paragraph.push(lines[i]);
          i += 1;
          addParagraph(parent, paragraph);
        }
      }
    }

    function renderReply(text) {
      const parts = splitShown(text);
      const fragment = document.createDocumentFragment();
      if (parts.body.trim()) {
        const box = document.createElement("div");
        box.className = "reply";
        fillMarkdown(box, parts.body);
        fragment.append(box);
      }
      if (parts.decision) {
        const line = document.createElement("p");
        line.className = "decision";
        line.textContent = parts.decision;
        fragment.append(line);
      }
      if (!fragment.childNodes.length) {
        const empty = document.createElement("div");
        empty.className = "reply";
        fragment.append(empty);
      }
      return fragment;
    }
    /* md-end */

    function showLive(turn, text) {
      turn.dataset.live = text;
      turn.querySelectorAll(".pending, .reply, .decision, .note").forEach((node) => node.remove());
      turn.append(renderReply(text));
      turn.scrollIntoView({ block: "end" });
    }

    function paintDelta(turn, delta) {
      const current = turn.dataset.live || "";
      const full = current + delta;
      if (delta.length <= 16) {
        showLive(turn, full);
        return Promise.resolve();
      }
      const step = Math.max(1, Math.ceil(delta.length / 24));
      let count = current.length;
      return new Promise((resolve) => {
        const tick = () => {
          count = Math.min(full.length, count + step);
          showLive(turn, full.slice(0, count));
          if (count < full.length) requestAnimationFrame(tick);
          else resolve();
        };
        requestAnimationFrame(tick);
      });
    }

    function showFailure(turn, text) {
      turn.querySelectorAll(".pending, .reply, .decision, .note").forEach((node) => node.remove());
      const fail = document.createElement("p");
      fail.className = "fail";
      fail.textContent = text;
      turn.append(fail);
    }

    async function readNdjson(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      try {
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed) await onEvent(JSON.parse(trimmed));
          }
          if (done) break;
        }
        if (buffer.trim()) await onEvent(JSON.parse(buffer.trim()));
      } finally {
        try { await reader.cancel(); } catch (err) { /* 连接已经结束。 */ }
      }
    }

    function renderHistory(turns) {
      thread.replaceChildren();
      if (!turns.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.id = "empty";
        empty.textContent = "还没有对话。写下一句想说的话。";
        thread.append(empty);
        return;
      }
      for (const turn of turns) {
        const article = document.createElement("article");
        article.className = "turn";
        const who = document.createElement("p");
        who.className = "who";
        who.textContent = turn.channel === "weixin" ? "微信" : "你";
        const said = document.createElement("p");
        said.className = "said";
        said.textContent = turn.user || "";
        article.append(who, said, renderReply(turn.reply || ""));
        if (turn.note) {
          const note = document.createElement("p");
          note.className = "note";
          note.textContent = turn.note;
          article.append(note);
        }
        thread.append(article);
      }
      thread.lastElementChild.scrollIntoView({ block: "end" });
    }

    async function loadHistory() {
      if (sending || holdError) return;
      try {
        const response = await fetch("/api/history");
        if (!response.ok) return;
        const data = await response.json();
        const turns = data.turns || [];
        const key = turns.map((turn) => turn.id || "").join("\n");
        if (key === historyKey) return;
        historyKey = key;
        renderHistory(turns);
      } catch (err) {
        /* 下一轮再取。 */
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) {
        formError.hidden = false;
        formError.textContent = "先写一句话。";
        input.focus();
        return;
      }
      formError.hidden = true;
      holdError = false;
      const empty = document.getElementById("empty");
      if (empty) empty.remove();
      input.value = "";
      sending = true;
      send.disabled = true;
      input.disabled = true;

      const turn = document.createElement("article");
      turn.className = "turn";
      const who = document.createElement("p");
      who.className = "who";
      who.textContent = "你";
      const said = document.createElement("p");
      said.className = "said";
      said.textContent = message;
      const pending = document.createElement("p");
      pending.className = "pending";
      pending.textContent = "正在回复…";
      turn.append(who, said, pending);
      thread.append(turn);
      thread.scrollIntoView({ block: "end" });

      try {
        const response = await fetch("/api/handle/stream", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/x-ndjson"
          },
          body: JSON.stringify({ message })
        });
        if (!response.ok || !response.body) {
          let data = {};
          try { data = await response.json(); } catch (err) { data = {}; }
          const failure = new Error("http");
          failure.detail = data.error || "没能回复。";
          throw failure;
        }
        let note = "";
        await readNdjson(response, async (event) => {
          if (event.error) {
            const failure = new Error("stream");
            failure.detail = event.error;
            throw failure;
          }
          if (event.delta) await paintDelta(turn, event.delta);
          if (typeof event.reply === "string") {
            showLive(turn, event.reply);
            note = event.note || "";
          }
        });
        if (note) {
          const line = document.createElement("p");
          line.className = "note";
          line.textContent = note;
          turn.append(line);
        }
        sending = false;
        await loadHistory();
      } catch (err) {
        holdError = true;
        showFailure(turn, err.detail || "没能连上工作台。");
      } finally {
        sending = false;
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (weixinOn && document.visibilityState === "visible") loadHistory();
    });
    loadStatus();
    loadHistory();
  </script>
</body>
</html>
